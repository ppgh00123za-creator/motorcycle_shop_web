<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#1f2026" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d90429" />
      <stop offset="100%" stop-color="#ef233c" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" rx="16" fill="url(#bgGrad)"/>
  <circle cx="500" cy="110" r="160" fill="#d90429" opacity="0.08"/>
  <circle cx="100" cy="300" r="130" fill="#ef233c" opacity="0.05"/>

  <!-- Top Brand Tag -->
  <path d="M 0 0 L 220 0 L 180 54 L 0 54 Z" fill="url(#brandGrad)" />
  <text x="32" y="35" font-family="'Prompt', 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="1.5">HONDA</text>

  <!-- Status badge -->
  

  <!-- Motorcycle Chassis Graphic -->
  <g transform="translate(75, 80)" filter="url(#shadow)">
    
        <!-- Wheels -->
        <circle cx="85" cy="180" r="54" fill="none" stroke="#252528" stroke-width="14"/>
        <circle cx="85" cy="180" r="46" fill="none" stroke="#ef233c" stroke-width="3" opacity="0.5"/>
        <circle cx="85" cy="180" r="20" fill="#141416" stroke="#444" stroke-width="4"/>
        <circle cx="365" cy="180" r="54" fill="none" stroke="#252528" stroke-width="14"/>
        <circle cx="365" cy="180" r="46" fill="none" stroke="#ef233c" stroke-width="3" opacity="0.5"/>
        <circle cx="365" cy="180" r="20" fill="#141416" stroke="#444" stroke-width="4"/>
        <!-- Frame & Fairing -->
        <path d="M 85 180 L 180 150 L 250 115 L 330 85 L 365 180" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
        <!-- Curved Step-through Cover -->
        <path d="M 175 140 C 210 110, 270 100, 315 110 L 330 145 L 240 155 Z" fill="#d90429" opacity="0.95"/>
        <path d="M 140 120 C 180 115, 220 118, 250 130 L 245 145 L 145 135 Z" fill="#18181c" stroke="#444" stroke-width="2"/>
        <!-- Front Shield -->
        <path d="M 290 85 L 345 130 L 320 165 Z" fill="#1e1e24" opacity="0.9"/>
        <line x1="320" y1="85" x2="335" y2="58" stroke="#777" stroke-width="8" stroke-linecap="round"/>
        <circle cx="342" cy="62" r="9" fill="#f8f9fa"/>
        <!-- Exhaust -->
        <path d="M 200 165 L 140 180 L 65 185" fill="none" stroke="#888" stroke-width="8" stroke-linecap="round"/>
        
  </g>

  <!-- Bottom Info Container -->
  <rect x="24" y="300" width="552" height="76" rx="12" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Model Title & Specs -->
  <text x="44" y="333" font-family="'Prompt', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#ffffff">Wave 110i</text>
  <text x="44" y="357" font-family="'Prompt', 'Segoe UI', sans-serif" font-size="13" fill="#9999a5">ประเภท: ครอบครัว | พิกัด ≤ 160 cc (2024)</text>

  <!-- CC Badge -->
  <rect x="456" y="316" width="100" height="42" rx="8" fill="#d90429"/>
  <text x="506" y="343" font-family="'Prompt', 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">109 cc</text>
</svg>