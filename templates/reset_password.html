{% extends 'base.html' %}

{% block title %}ตั้งรหัสผ่านใหม่ - {{ shop_config.name }}{% endblock %}

{% block content %}
  <div class="auth-wrapper" style="max-width: 480px;">
    <div class="auth-header">
      <h2>ตั้งรหัสผ่านใหม่</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
        สำหรับบัญชี <strong>{{ email }}</strong>
      </p>
    </div>

    <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="password">รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร) *</label>
        <div class="password-field-wrapper">
          <input type="password" name="password" id="password" class="form-control" placeholder="อย่างน้อย 8 ตัว ผสมตัวอักษรและตัวเลข" minlength="8" pattern="^(?=.*[A-Za-z])(?=.*\d).{8,}$" title="รหัสผ่านต้องมีความยาวอย่างน้อย 8 ตัวอักษร และมีทั้งตัวอักษรภาษาอังกฤษกับตัวเลข" required autofocus>
          <button type="button" class="toggle-password-btn" data-target="password" title="แสดงรหัสผ่าน" aria-label="แสดงรหัสผ่าน">
            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-off-icon" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="confirm_password">ยืนยันรหัสผ่านใหม่ *</label>
        <div class="password-field-wrapper">
          <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง" minlength="8" required>
          <button type="button" class="toggle-password-btn" data-target="confirm_password" title="แสดงรหัสผ่าน" aria-label="แสดงรหัสผ่าน">
            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-off-icon" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1.5rem;">
        ข้อกำหนด: ความยาวอย่างน้อย 8 ตัวอักษร และต้องมีทั้งตัวอักษรภาษาอังกฤษกับตัวเลข
      </p>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
        บันทึกรหัสผ่านใหม่
      </button>
    </form>
  </div>
{% endblock %}
