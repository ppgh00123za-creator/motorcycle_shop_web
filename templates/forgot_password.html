{% extends 'base.html' %}

{% block title %}ลืมรหัสผ่าน - {{ shop_config.name }}{% endblock %}

{% block content %}
  <div class="auth-wrapper" style="max-width: 480px;">
    <div class="auth-header">
      <h2>ลืมรหัสผ่าน</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">
        ระบุอีเมลที่ลงทะเบียนไว้เพื่อรับลิงก์สำหรับตั้งรหัสผ่านใหม่
      </p>
    </div>

    <form action="{{ url_for('auth.forgot_password') }}" method="POST">
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="email">อีเมลที่ใช้ลงทะเบียน *</label>
        <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" value="{{ email or '' }}" required autofocus>
        <small style="color: var(--text-muted); font-size: 0.8rem; margin-top: 0.35rem; display: block;">
          ระบบจะส่งลิงก์ความปลอดภัยที่มีอายุการใช้งาน 1 ชั่วโมงไปยังอีเมลนี้
        </small>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
        ส่งลิงก์รีเซ็ตรหัสผ่าน
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); border-top: 1px solid var(--border-light); padding-top: 1rem;">
      <a href="{{ url_for('auth.login') }}" style="color: var(--primary-red); font-weight: 600; text-decoration: none;">
        &larr; กลับสู่หน้าเข้าสู่ระบบ
      </a>
    </div>
  </div>
{% endblock %}
